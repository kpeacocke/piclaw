---
# SPDX-License-Identifier: Apache-2.0

# Reference definitions for AWX custom credentials used by this project.
# These are source-controlled examples for manual AWX creation or API-based provisioning.
# In the AWX UI, create a credential type and paste the `inputs` value into
# `Input configuration`, then paste the `injectors` value into `Injector
# configuration` or `Output configuration` depending on your AWX version.

credential_types:
  - name: piclaw-tailscale-auth
    description: Store the reusable Tailscale auth key as an AWX-managed secret.
    kind: cloud
    inputs:
      fields:
        - id: tailscale_auth_key
          type: string
          label: Tailscale auth key
          secret: true
          help_text: Reusable key from Tailscale admin console, format tskey-auth-...
      required:
        - tailscale_auth_key
    injectors:
      extra_vars:
        tailscale_auth_key: '{{ tailscale_auth_key }}'

credentials:
  - name: piclaw-tailscale-prod
    credential_type: piclaw-tailscale-auth
    description: Attach to piclaw-bootstrap to inject tailscale_auth_key automatically.
    organization: Default
    inputs:
      tailscale_auth_key: REPLACE_IN_AWX_ONLY
