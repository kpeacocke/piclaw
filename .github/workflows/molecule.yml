name: molecule

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - molecule/**
      - playbooks/**
      - roles/**
      - requirements-dev.txt
      - requirements-dev.lock
      - .pre-commit-config.yaml
      - .github/workflows/molecule.yml
  push:
    branches:
      - main
    paths:
      - molecule/**
      - playbooks/**
      - roles/**
      - requirements-dev.txt
      - requirements-dev.lock
      - .pre-commit-config.yaml
      - .github/workflows/molecule.yml

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
          ansible-galaxy collection install --no-cache -r collections/requirements.yml

      - name: Run Molecule syntax scenario
        run: molecule test -s default
