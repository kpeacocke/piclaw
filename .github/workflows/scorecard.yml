name: scorecard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

      - name: Remind about OpenSSF Best Practices badge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="OpenSSF Best Practices badge reminder"
          finding="$(jq -r '[.runs[]?.results[]? | select(.ruleId == "CIIBestPracticesID") | .message.text] | first // empty' results.sarif)"
          issue="$(gh issue list --repo "${REPOSITORY}" --state all --search 'in:title "OpenSSF Best Practices badge reminder"' --json number,title,state --jq '.[] | select(.title == "OpenSSF Best Practices badge reminder") | "\(.number) \(.state)"' | tail -n 1)"

          if [[ "${finding}" == *"badge detected: InProgress"* ]]; then
            body="$(printf '%s\n\n%s\n\n%s\n' \
              "${finding}" \
              "Complete the OpenSSF Best Practices profile at https://www.bestpractices.dev/." \
              "This reminder is updated by Scorecard and closed automatically when the badge leaves InProgress.")"
            if [[ -n "${issue}" ]]; then
              issue_number="${issue%% *}"
              issue_state="${issue##* }"
              gh issue edit "${issue_number}" --repo "${REPOSITORY}" --body "${body}"
              if [[ "${issue_state}" == "CLOSED" ]]; then
                gh issue reopen "${issue_number}" --repo "${REPOSITORY}"
              fi
            else
              gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
            fi
          elif [[ -n "${issue}" ]]; then
            issue_number="${issue%% *}"
            issue_state="${issue##* }"
            if [[ "${issue_state}" == "OPEN" ]]; then
              gh issue close "${issue_number}" --repo "${REPOSITORY}" \
                --comment "Scorecard no longer reports an InProgress Best Practices badge."
            fi
          fi
