name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-approve-and-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Update branch when behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MERGE_STATE="$(gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus')"
          if [[ "${MERGE_STATE}" == "BEHIND" ]]; then
            gh api \
              --method PUT \
              "repos/${{ github.repository }}/pulls/${PR_NUMBER}/update-branch"
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve pull request
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if gh pr view "$PR_URL" --repo "${{ github.repository }}" --json reviews --jq 'any(.reviews[]; .state == "APPROVED")' | grep -q 'true'; then
            echo "Pull request already has an approval."
            exit 0
          fi

          gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "${PR_NUMBER}" --repo "${{ github.repository }}" --auto --rebase --delete-branch=false
