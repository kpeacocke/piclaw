name: devcontainer-smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - .devcontainer/**
      - requirements-dev.txt
      - requirements-dev.lock
      - collections/requirements.yml
      - .github/workflows/devcontainer-smoke.yml
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - requirements-dev.txt
      - requirements-dev.lock
      - collections/requirements.yml
      - .github/workflows/devcontainer-smoke.yml

permissions:
  contents: read

concurrency:
  group: devcontainer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container and validate toolchain
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          runCmd: |
            bash .devcontainer/post-create.sh
            gh --version | head -n 1
            ansible --version | head -n 1
            ansible-lint --version | head -n 1
            molecule --version | head -n 1
            pytest --version
            sonar-scanner --version | head -n 1
