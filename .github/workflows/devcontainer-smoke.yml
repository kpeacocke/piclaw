name: devcontainer-smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - .devcontainer/**
      - requirements-dev.txt
      - requirements-dev.lock
      - collections/requirements.yml
      - .github/workflows/devcontainer-smoke.yml
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - requirements-dev.txt
      - requirements-dev.lock
      - collections/requirements.yml
      - .github/workflows/devcontainer-smoke.yml

permissions:
  contents: read

concurrency:
  group: devcontainer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build container and validate toolchain
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: |
            bash .devcontainer/post-create.sh
            gh --version | head -n 1
            ansible --version | head -n 1
            ansible-lint --version | head -n 1
            molecule --version | head -n 1
            pytest --version
            sonar-scanner --version | head -n 1
