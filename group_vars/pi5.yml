---
pi_user: "{{ ansible_user | default('pi') }}"

# Local inventory overrides for the `pi5` group.
# AWX should set environment-specific values in inventory/group/host vars instead.
# Repository-wide defaults now live under each role's defaults/main.yml.

# Tailscale mesh VPN configuration
# Obtain a reusable auth key from https://login.tailscale.com/admin/settings/keys
# In AWX, the TAILSCALE_AUTH_KEY env var is injected by the piclaw-tailscale-auth credential.
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') | default('', true) }}"
tailscale_accept_dns: true
tailscale_advertise_routes: false
tailscale_advertise_exit_node: false

# Common local overrides:
hailo_model: llama3.2:3b
use_sanitizer_proxy: true
openclaw_auto_fallback_to_external_when_no_hailo: true

# Waveshare/Core 2-CH PCIe expansion board (safe, detection-gated tuning)
pcie_force_enable: true
pcie_force_enable_require_hat_detection: true
pcie_force_enable_fail_if_boot_config_missing: false
pcie_gen3_enabled: false
pcie_gen3_require_hat_detection: true
pcie_gen3_fail_if_boot_config_missing: false
pcie_gen3_hat_match_patterns:
  - Waveshare
  - PCIe TO 2-CH PCIe HAT
  - 2-CH PCIe Adapter Board
  - PCIe Expansion Board for Raspberry Pi 5

# DAC Pro HAT audio (guarded by runtime HAT detection in the base role)
audio_dac_enabled: true
audio_dac_require_hat_detection: true
audio_dac_overlay: hifiberry-dacplus-pro
audio_dac_configure_alsa_default: true
audio_dac_verify_playback_device: true
audio_dac_fail_if_alsa_card_missing: false

# Use direct Tailnet bind mode for stable remote access over Tailscale mesh.
# OpenClaw listens on tailnet IP at port 18789 (no HTTPS, no Serve wrapper).
openclaw_gateway_bind_mode: tailnet
