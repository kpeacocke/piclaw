---
# SPDX-License-Identifier: Apache-2.0
- name: Install Hailo Ollama model stack and OpenClaw
  hosts: pi5
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/pi5.yml

  pre_tasks:
    - name: Verify Tailscale is active and healthy
      ansible.builtin.systemd:
        name: tailscaled
      register: tailscale_status

    - name: Assert Tailscale daemon is active
      ansible.builtin.assert:
        that:
          - tailscale_status.status.ActiveState == 'active'
        fail_msg: "Tailscale daemon is not active. Run bootstrap playbook first to set up Tailscale mesh VPN."

  roles:
    - role: docker
    - role: hailo_ollama
    - role: openclaw

  post_tasks:
    - name: Configure Tailscale serve to expose OpenClaw gateway
      ansible.builtin.command: >
        tailscale serve tcp/{{ openclaw_gateway_port }} http://127.0.0.1:{{ openclaw_gateway_port }}
      register: tailscale_serve_result
      changed_when: false
      failed_when: false

    - name: Verify Tailscale serve is configured for OpenClaw
      ansible.builtin.command: >
        tailscale serve status --json
      register: tailscale_serve_status
      changed_when: false
      failed_when: false

    - name: Display Tailscale serve configuration for debugging
      ansible.builtin.debug:
        var: tailscale_serve_status.stdout | from_json
