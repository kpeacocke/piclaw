---
# SPDX-License-Identifier: Apache-2.0
- name: Validate Hailo PCIe presence
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -i hailo
  args:
    executable: /bin/bash
  register: validate_lspci
  changed_when: false
  failed_when: validate_lspci.rc != 0
  when: openclaw_use_local_backend | bool

- name: Validate /dev/hailo0 exists
  ansible.builtin.stat:
    path: /dev/hailo0
  register: validate_hailo_dev
  when: openclaw_use_local_backend | bool

- name: Fail if /dev/hailo0 missing
  ansible.builtin.assert:
    that:
      - validate_hailo_dev.stat.exists
    fail_msg: /dev/hailo0 is missing.
  when: openclaw_use_local_backend | bool

- name: Validate Hailo runtime identify command
  ansible.builtin.command: hailortcli fw-control identify
  register: validate_identify
  changed_when: false
  failed_when: validate_identify.rc != 0
  when: openclaw_use_local_backend | bool

- name: Validate Hailo Ollama version endpoint
  ansible.builtin.uri:
    url: "http://{{ hailo_bind_host }}:{{ hailo_port }}/api/version"
    method: GET
    status_code: 200
  when: openclaw_use_local_backend | bool

- name: Validate selected model is listed
  ansible.builtin.uri:
    url: "http://{{ hailo_bind_host }}:{{ hailo_port }}/api/tags"
    method: GET
    return_content: true
    status_code: 200
  register: validate_tags
  when: openclaw_use_local_backend | bool

- name: Collect Hailo tag model objects during validation
  ansible.builtin.set_fact:
    validate_tags_models: >-
      {{
        validate_tags.json.models
        if (
          validate_tags.json is defined
          and validate_tags.json is mapping
          and validate_tags.json.models is defined
        )
        else []
      }}
  when: openclaw_use_local_backend | bool

- name: Parse tags payload content during validation when json field is unavailable
  when: openclaw_use_local_backend | bool
  block:
    - name: Parse tags content as JSON during validation
      ansible.builtin.set_fact:
        validate_tags_models: "{{ ((validate_tags.content | from_json).models | default([])) }}"
      when:
        - (validate_tags_models | default([]) | length) == 0
        - validate_tags.content is defined
        - (validate_tags.content | trim) is search('^\{')
  rescue:
    - name: Fall back to empty model list when tags payload cannot be parsed
      ansible.builtin.set_fact:
        validate_tags_models: []

- name: Capture available Hailo model tags during validation
  ansible.builtin.set_fact:
    validate_hailo_available_models: >-
      {{
        (
          (validate_tags_models | selectattr('name', 'defined') | map(attribute='name') | list)
          +
          (validate_tags_models | selectattr('model', 'defined') | map(attribute='model') | list)
        )
        | unique
        | list
      }}
  when: openclaw_use_local_backend | bool

- name: Resolve Hailo runtime model tag during validation
  ansible.builtin.set_fact:
    hailo_runtime_model: >-
      {{
        (validate_hailo_available_models | select('equalto', hailo_model) | list | first)
        | default(
            (validate_hailo_available_models
             | select('match', '^(' ~ (hailo_model | regex_escape) ~ '|.*/' ~ (hailo_model | regex_escape) ~ ')([._-].*)?$')
             | list | first),
            true
          )
      }}
  when: openclaw_use_local_backend | bool

- name: Assert selected model appears in tags
  ansible.builtin.assert:
    that:
      - (hailo_runtime_model | default('') | length) > 0
    fail_msg: >-
      Model {{ hailo_model }} was not found in backend tags.
      Available tags: {{ validate_hailo_available_models | join(', ') if (validate_hailo_available_models | length > 0) else 'none' }}
  when: openclaw_use_local_backend | bool

- name: Validate proxy endpoint when enabled
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ proxy_port }}/api/tags"
    method: GET
    status_code: 200
  when: openclaw_use_local_backend | bool and use_sanitizer_proxy | bool

- name: Validate external provider URL when external profile is selected
  ansible.builtin.assert:
    that:
      - (openclaw_external_provider_base_url | trim | length) > 0
    fail_msg: openclaw_external_provider_base_url must be set when openclaw_profile is external-power.
  when: not (openclaw_use_local_backend | bool)

- name: Ensure provider config file exists
  ansible.builtin.stat:
    path: "{{ openclaw_config_path }}"
  register: validate_cfg

- name: Assert provider config file exists
  ansible.builtin.assert:
    that:
      - validate_cfg.stat.exists
    fail_msg: OpenClaw provider config file missing at {{ openclaw_config_path }}.

- name: Read OpenClaw provider config
  ansible.builtin.slurp:
    path: "{{ openclaw_config_path }}"
  register: validate_cfg_content

- name: Read OpenClaw user config
  ansible.builtin.slurp:
    path: "{{ openclaw_validate_user_home }}/.openclaw/openclaw.json"
  register: validate_user_cfg_content

- name: Parse OpenClaw user config JSON
  ansible.builtin.set_fact:
    validate_user_cfg_json: "{{ validate_user_cfg_content.content | b64decode | from_json }}"

- name: Assert provider URL matches desired value
  ansible.builtin.assert:
    that:
      - (validate_cfg_content.content | b64decode) is search(openclaw_provider_base_url)
    fail_msg: OpenClaw provider base URL mismatch; expected {{ openclaw_provider_base_url }}.

- name: Gather service facts
  ansible.builtin.service_facts:
  become: true

- name: Assert Hailo Ollama service is active
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(hailo_ollama_service_name ~ '.service', {}).get('state', 'stopped') == 'running'
    fail_msg: "{{ hailo_ollama_service_name }}.service is not running."
  when: openclaw_use_local_backend | bool
  become: true

- name: Assert proxy service is active when enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(hailo_proxy_service_name ~ '.service', {}).get('state', 'stopped') == 'running'
    fail_msg: "{{ hailo_proxy_service_name }}.service is not running while use_sanitizer_proxy=true."
  when: openclaw_use_local_backend | bool and use_sanitizer_proxy | bool
  become: true

- name: Validate OpenClaw gateway reports healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port | default(18789) }}/health"
    method: GET
    status_code: 200
    return_content: true
    timeout: 5
  register: validate_openclaw_health
  retries: 10
  delay: 2
  until: validate_openclaw_health.status == 200

- name: Validate OpenClaw gateway status output
  ansible.builtin.command: openclaw status --all
  register: validate_openclaw_status_all
  become: true
  become_user: "{{ openclaw_validate_user }}"
  environment:
    HOME: "{{ openclaw_validate_user_home }}"
  changed_when: false
  failed_when: false

- name: Capture OpenClaw deep status output
  ansible.builtin.command: openclaw status --deep
  register: validate_openclaw_status_deep
  become: true
  become_user: "{{ openclaw_validate_user }}"
  environment:
    HOME: "{{ openclaw_validate_user_home }}"
  changed_when: false
  failed_when: false

- name: Capture OpenClaw gateway listeners
  ansible.builtin.command: ss -ltnp
  register: validate_openclaw_listeners
  changed_when: false

- name: Assert OpenClaw gateway listener exists on expected port
  ansible.builtin.assert:
    that:
      - (
          validate_openclaw_listeners.stdout
          | regex_search('(127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\]|\\[::\\]):' ~ (openclaw_gateway_port | default(18789) | string))
        ) is not none
    fail_msg: >-
      OpenClaw gateway listener was not found on port {{ openclaw_gateway_port | default(18789) }}.

- name: Capture Tailscale status JSON
  ansible.builtin.command: tailscale status --json
  register: validate_tailscale_status
  changed_when: false
  failed_when: false

- name: Assert Tailscale backend is online
  ansible.builtin.assert:
    that:
      - validate_tailscale_status.rc == 0
      - ((validate_tailscale_status.stdout | default('{}') | from_json).BackendState | default('')) == 'Running'
      - (((validate_tailscale_status.stdout | default('{}') | from_json).Self | default({})).Online | default(false) | bool)
    fail_msg: >-
      Tailscale is offline on this host. Run bootstrap with a valid Tailscale auth credential
      or reconnect Tailscale before relying on remote OpenClaw access.

- name: Assert OpenClaw is configured for direct Tailnet binding
  ansible.builtin.assert:
    that:
      - (openclaw_gateway_bind_mode | default('loopback')) == 'tailnet'
      - (validate_user_cfg_json.gateway.tailscale.mode | default('serve')) == 'off'
    fail_msg: >
      OpenClaw is not configured for direct Tailnet binding.
      Expected openclaw_gateway_bind_mode=tailnet and gateway.tailscale.mode=off;
      got openclaw_gateway_bind_mode={{ openclaw_gateway_bind_mode | default('undefined') }}
      and gateway.tailscale.mode={{ validate_user_cfg_json.gateway.tailscale.mode | default('undefined') }}.
  when: validate_require_openclaw_tailscale_on | bool

- name: Functional chat roundtrip validation
  ansible.builtin.uri:
    url: "http://{{ hailo_bind_host }}:{{ hailo_port }}/api/chat"
    method: POST
    body_format: json
    body:
      model: "{{ hailo_runtime_model | default(hailo_model) }}"
      stream: false
      messages:
        - role: user
          content: "Respond with OK."
    return_content: true
    status_code: 200
    timeout: "{{ chat_smoke_timeout_seconds }}"
  register: validate_chat
  retries: "{{ chat_smoke_retries }}"
  delay: "{{ chat_smoke_retry_delay_seconds }}"
  until: validate_chat.status == 200
  when: openclaw_use_local_backend | bool

- name: Assert functional chat response is non-empty
  ansible.builtin.assert:
    that:
      - (validate_chat.json.message.content | default('') | trim | length) > 0
    fail_msg: Functional chat roundtrip did not return content.
  when: openclaw_use_local_backend | bool

- name: Detect cameras with rpicam tool during validation
  ansible.builtin.command: rpicam-hello --list-cameras
  register: validate_rpicam_camera_list
  changed_when: false
  failed_when: false

- name: Detect cameras with libcamera tool during validation
  ansible.builtin.command: libcamera-hello --list-cameras
  register: validate_libcamera_camera_list
  changed_when: false
  failed_when: false

- name: Select camera enumeration output for AI Camera validation
  ansible.builtin.set_fact:
    validate_ai_camera_list_output: >-
      {{
        (validate_rpicam_camera_list.stdout | default('') | trim)
        if (validate_rpicam_camera_list.rc | default(1)) == 0
        else (validate_libcamera_camera_list.stdout | default('') | trim)
      }}

- name: Compute AI Camera detection state during validation
  ansible.builtin.set_fact:
    validate_ai_camera_detected: >-
      {{
        ((validate_ai_camera_list_output | default('')
          | regex_search(ai_camera_detect_match_patterns | map('regex_escape') | join('|'), ignorecase=True))
        is not none)
      }}

- name: Report AI Camera detection during validation
  ansible.builtin.debug:
    msg: "AI Camera detected (IMX500): {{ validate_ai_camera_detected | bool }}"

- name: Stat expected AI Camera firmware files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ validate_ai_camera_firmware_files }}"
  register: validate_ai_camera_firmware_stats
  when:
    - ai_camera_enabled | bool
    - validate_ai_camera_check_firmware_files | bool
    - (not ai_camera_require_detection | bool) or (validate_ai_camera_detected | bool)

- name: Assert AI Camera firmware files exist when required
  ansible.builtin.assert:
    that:
      - (validate_ai_camera_firmware_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) == (validate_ai_camera_firmware_files | length)
    fail_msg: >-
      AI Camera firmware files are missing. Expected: {{ validate_ai_camera_firmware_files | join(', ') }}.
  when:
    - ai_camera_enabled | bool
    - validate_ai_camera_check_firmware_files | bool
    - (not ai_camera_require_detection | bool) or (validate_ai_camera_detected | bool)

- name: Read HAT product for Sense HAT validation
  ansible.builtin.shell: |
    set -o pipefail
    if [ -f /proc/device-tree/hat/product ]; then
      tr -d '\0' < /proc/device-tree/hat/product
    fi
  args:
    executable: /bin/bash
  register: validate_sense_hat_product
  changed_when: false
  failed_when: false

- name: Read HAT vendor for Sense HAT validation
  ansible.builtin.shell: |
    set -o pipefail
    if [ -f /proc/device-tree/hat/vendor ]; then
      tr -d '\0' < /proc/device-tree/hat/vendor
    fi
  args:
    executable: /bin/bash
  register: validate_sense_hat_vendor
  changed_when: false
  failed_when: false

- name: Detect Sense HAT joystick input device during validation
  ansible.builtin.command: grep -i Sense\ HAT\ Joystick /proc/bus/input/devices
  register: validate_sense_hat_joystick
  changed_when: false
  failed_when: false

- name: Compute Sense HAT detection state during validation
  ansible.builtin.set_fact:
    validate_sense_hat_detected: >-
      {{
        (
          (((validate_sense_hat_vendor.stdout | default('') | trim) ~ ' ' ~ (validate_sense_hat_product.stdout | default('') | trim))
            | regex_search(sense_hat_detect_match_patterns | map('regex_escape') | join('|'), ignorecase=True))
          is not none
        )
        or
        (
          (validate_sense_hat_joystick.stdout | default('')
            | regex_search('Sense HAT Joystick', ignorecase=True)) is not none
        )
      }}

- name: Report Sense HAT detection during validation
  ansible.builtin.debug:
    msg: "Sense HAT detected: {{ validate_sense_hat_detected | bool }}"

- name: Validate Sense HAT Python import
  ansible.builtin.command: python3 -c "import sense_hat"
  register: validate_sense_hat_python
  changed_when: false
  failed_when: validate_sense_hat_python.rc != 0
  when:
    - sense_hat_enabled | bool
    - validate_sense_hat_check_python_import | bool
    - (not sense_hat_require_detection | bool) or (validate_sense_hat_detected | bool)
