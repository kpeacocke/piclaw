---
# SPDX-License-Identifier: Apache-2.0
run_full_upgrade: true
hailo_run_if_detected: true

# Enable PCIe Gen 3.0 — required for AI Kit (M.2 slot); not needed for AI HAT+ 2.
pcie_gen3_enabled: false
pcie_gen3_require_hat_detection: false
pcie_gen3_fail_if_boot_config_missing: false
pcie_gen3_boot_config_candidates:
  - /boot/firmware/config.txt
  - /boot/config.txt
pcie_gen3_hat_match_patterns:
  - Waveshare
  - PCIe TO 2-CH PCIe HAT
  - 2-CH PCIe Adapter Board
  - PCIe Expansion Board for Raspberry Pi 5

# Safe PCIe interface enable flag for boards that are Gen2-only but may need explicit
# PCIe enablement on some images/firmware combinations.
pcie_force_enable: false
pcie_force_enable_require_hat_detection: false
pcie_force_enable_fail_if_boot_config_missing: false
pcie_force_enable_boot_config_candidates:
  - /boot/firmware/config.txt
  - /boot/config.txt

# Optional NVMe long-term memory provisioning for Raspberry Pi M.2 HAT+ (SC1166).
# Uses detect-and-configure flow and only formats when no filesystem is present.
nvme_memory_enabled: false
nvme_memory_require_hat_detection: true
nvme_memory_fail_if_no_device: false
nvme_memory_fail_if_boot_config_missing: false
nvme_memory_fail_if_no_uuid: true
nvme_memory_ensure_pcie_enabled: true
nvme_memory_boot_config_candidates:
  - /boot/firmware/config.txt
  - /boot/config.txt
nvme_memory_hat_match_patterns:
  - Raspberry Pi M.2 HAT+
  - M.2 HAT+
  - SC1166
nvme_memory_target_device: ""
nvme_memory_use_first_partition_if_present: true
nvme_memory_filesystem: ext4
nvme_memory_label: AI_MEMORY
nvme_memory_mount_point: /srv/ai-memory
nvme_memory_mount_owner: "{{ pi_user | default('pi') }}"
nvme_memory_mount_group: "{{ pi_user | default('pi') }}"
nvme_memory_mount_mode: "0775"
nvme_memory_fstab_opts: defaults,noatime

# OpenClaw currently requires Node.js >= 22.12.0.
# Keep Node.js on the latest release for the selected major channel.
bootstrap_nodejs_major: 24
bootstrap_nodejs_min_version: 24.0.0

# Optional DAC HAT audio configuration.
# When enabled, the role disables onboard analog audio and adds a DAC overlay.
audio_dac_enabled: false
audio_dac_require_hat_detection: true
audio_dac_overlay: hifiberry-dacplus-pro
audio_dac_hat_match_patterns:
  - DAC+ Pro
  - DAC Pro
  - DAC2 Pro
  - IQaudIO DAC Pro
  - HiFiBerry DAC+ Pro

# Optional ALSA automation for Raspberry Pi OS once DAC is enabled.
audio_dac_configure_alsa_default: true
audio_dac_verify_playback_device: true
audio_dac_fail_if_alsa_card_missing: false
audio_dac_fail_if_boot_config_missing: false
audio_dac_boot_config_candidates:
  - /boot/firmware/config.txt
  - /boot/config.txt
audio_dac_alsa_card_match_patterns:
  - snd_rpi_hifiberry
  - sndrpihifiberry
  - iqaudio
  - hifiberry
  - dac

# Optional Raspberry Pi AI Camera (IMX500) support.
# Official docs require installing `imx500-all` on Raspberry Pi OS.
ai_camera_enabled: false
ai_camera_require_detection: true
ai_camera_fail_if_not_detected: false
ai_camera_detect_match_patterns:
  - imx500
  - ai camera
ai_camera_install_packages:
  - imx500-all
ai_camera_install_picamera2_opencv_extras: false
ai_camera_picamera2_extra_packages:
  - python3-opencv
  - python3-munkres
